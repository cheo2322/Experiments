data:
  csv_path: t1_third_approach/data/rc4_dataset.csv
  output_dir: t1_third_approach/artifacts
  split:
    train: 0.7
    eval: 0.2
    infer: 0.1
  use_sos_eos: true # Add start and end tokens to the sequences
  n: 10
  min_len: 5
  max_len: 12
  key: 'secretkey'

train:
  epochs: 10
  lr: 0.001
  teacher_forcing: 1.0
  device: 'auto' # "cuda" | "cpu" | "auto"
  grad_clip: 1.0
  ckpt_every: 1
